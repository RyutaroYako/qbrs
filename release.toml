# Workspace config for `cargo-release` (https://github.com/crate-ci/cargo-release).
# Two callers run `cargo release` against it: `scripts/release.sh` and the
# `cut` job in `.github/workflows/release.yaml`. Both run the gate first, so
# neither touches a version number before the tree is green. Nothing else
# should call `cargo release` directly.
#
# `tests/compile-bench`, `tests/dialect-exec`, `tests/embedded-pg`, and
# `examples` all carry `publish = false` in their own Cargo.toml. Their
# versions still move with the workspace, since they inherit it. Only
# qbrs-core, qbrs-macros, qbrs, and qbrs-sqlx are ever published.

# All four crates share one version number (`workspace.package.version`),
# so they bump and get tagged together rather than drifting independently.
shared-version = true
consolidate-commits = true

# qbrs and qbrs-sqlx depend on qbrs-core/qbrs-macros via
# `[workspace.dependencies]` version pins. Keep those exact rather than
# leaving a wider range once every crate has actually moved to the new
# version.
dependent-version = "upgrade"

tag-name = "v{{version}}"
tag-message = "Release {{version}}"
pre-release-commit-message = "Release {{version}}"

# CI publishes. Cutting a release ends at the tag, wherever it is cut from,
# and the tag is what the publish half runs against. So a crates.io
# credential never has to exist on a laptop.
publish = false
push = true
