# Run through `scripts/release.sh` or the `cut` job in `release.yaml`, never as a bare
# `cargo release`: both run the gate first, so no version moves before the tree is green.

shared-version = true
consolidate-commits = true

# `upgrade` rather than `fix`, which leaves a `[workspace.dependencies]` pin alone while
# it still matches, so `qbrs` would declare a wider range than the `qbrs-core` beside it.
dependent-version = "upgrade"

tag-name = "v{{version}}"
tag-message = "Release {{version}}"
pre-release-commit-message = "Release {{version}}"

# Not `true`: CI publishes from the tag through Trusted Publishing, so no crates.io
# credential has to exist wherever the release is cut.
publish = false
push = true
