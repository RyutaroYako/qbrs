[package]
name = "qbrs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
categories.workspace = true
keywords = ["sql", "database", "query-builder", "type-safe", "postgres"]
description = "A Drizzle-flavored, type-safe SQL query builder for Rust."

[features]
chrono = ["qbrs-core/chrono"]
uuid = ["qbrs-core/uuid"]
decimal = ["qbrs-core/decimal"]
json = ["qbrs-core/json"]

[dependencies]
qbrs-core.workspace = true
qbrs-macros.workspace = true

# Not a normal dependency for the `json` feature: a schema reaches `serde_json::Value`
# through its own dependency, and only the tests here name one.
[dev-dependencies]
serde_json = "1"
# Not redundant with the prelude's re-export: a test names the crate directly to show
# that the two are one item.
uuid = "1"

[package.metadata.docs.rs]
all-features = true

# Without these, the root README's Install section still asks for the previous version
# after a release.
[[package.metadata.release.pre-release-replacements]]
file = "../../README.md"
search = 'qbrs = "\d+\.\d+(\.\d+)?"'
replace = 'qbrs = "{{version}}"'

[[package.metadata.release.pre-release-replacements]]
file = "../../README.md"
search = 'qbrs-sqlx = "\d+\.\d+(\.\d+)?"'
replace = 'qbrs-sqlx = "{{version}}"'
