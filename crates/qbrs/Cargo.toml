[package]
name = "qbrs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
categories.workspace = true
keywords = ["sql", "database", "query-builder", "type-safe", "postgres"]
description = "A Drizzle-flavored, type-safe SQL query builder for Rust."

[features]
# Column types beyond the six a database always has; see `qbrs-core`.
chrono = ["qbrs-core/chrono"]
uuid = ["qbrs-core/uuid"]
decimal = ["qbrs-core/decimal"]

[dependencies]
qbrs-core.workspace = true
qbrs-macros.workspace = true

[package.metadata.docs.rs]
all-features = true
