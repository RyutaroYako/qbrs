[package]
name = "qbrs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
categories.workspace = true
keywords = ["sql", "database", "query-builder", "type-safe", "postgres"]
description = "A Drizzle-flavored, type-safe SQL query builder for Rust."

[features]
# Column types that need a crate of their own to decode to; see `qbrs-core`.
chrono = ["qbrs-core/chrono"]
uuid = ["qbrs-core/uuid"]
decimal = ["qbrs-core/decimal"]
json = ["qbrs-core/json"]

[dependencies]
qbrs-core.workspace = true
qbrs-macros.workspace = true

# Only the tests name a JSON document; a schema reaches the type through
# its own dependency.
[dev-dependencies]
serde_json = "1"

[package.metadata.docs.rs]
all-features = true

# The root README's Install section pins both versions, so a minor/major
# release needs the two lines updated too, or the example in the README
# would ask for a version that no longer matches the one just published.
[[package.metadata.release.pre-release-replacements]]
file = "../../README.md"
search = 'qbrs = "\d+\.\d+(\.\d+)?"'
replace = 'qbrs = "{{version}}"'

[[package.metadata.release.pre-release-replacements]]
file = "../../README.md"
search = 'qbrs-sqlx = "\d+\.\d+(\.\d+)?"'
replace = 'qbrs-sqlx = "{{version}}"'
