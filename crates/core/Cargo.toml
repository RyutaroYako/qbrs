[package]
name = "qbrs-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
categories.workspace = true
keywords = ["sql", "database", "query-builder", "type-safe", "postgres"]
description = "Core type-level machinery for the qbrs query builder (scope tracking, expressions, builders)."

[features]
# Column types that need a crate of their own to decode to. Each pulls in that crate
# whose type it decodes to, which is why none is on by default: `qbrs-core`
# has no dependencies unless a schema asks for one.
chrono = ["dep:chrono"]
uuid = ["dep:uuid"]
decimal = ["dep:rust_decimal"]
json = ["dep:serde_json"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }
uuid = { version = "1", default-features = false, optional = true }
rust_decimal = { version = "1", default-features = false, optional = true }
serde_json = { version = "1", default-features = false, features = ["std"], optional = true }

[package.metadata.docs.rs]
all-features = true
