[package]
name = "qbrs-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core type-level machinery for the qbrs query builder (scope tracking, expressions, builders)."

[features]
# Column types beyond the six a database always has. Each pulls in the crate
# whose type it decodes to, which is why none is on by default: `qbrs-core`
# has no dependencies unless a schema asks for one.
chrono = ["dep:chrono"]
uuid = ["dep:uuid"]
decimal = ["dep:rust_decimal"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }
uuid = { version = "1", default-features = false, optional = true }
rust_decimal = { version = "1", default-features = false, optional = true }
