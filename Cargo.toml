[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/macros",
    "crates/qbrs",
    "crates/qbrs-sqlx",
    "examples",
    "tests/compile-bench",
    "tests/dialect-exec",
    "tests/embedded-pg",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RyutaroYako/qbrs"
readme = "README.md"
categories = ["database"]

[workspace.dependencies]
qbrs-core = { version = "0.4.0", path = "crates/core" }
qbrs-macros = { version = "0.4.0", path = "crates/macros" }
