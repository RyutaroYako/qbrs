name: Release

# A tag is the release, and this owns both halves of making one. Dispatched
# from the default branch with `bump`, it cuts the tag. Reached by that tag,
# it publishes. `scripts/release.sh` cuts the same tag from a laptop.
#
# Dispatched against a tag with `packages`, it republishes just those crates.
# That is the recovery door. `cargo publish --workspace` packages and verifies
# all four crates before uploading any, so a failure almost always lands
# before anything is published. What it cannot do is resume: a version
# already on crates.io is an error rather than a skip. Re-running the failed
# run replays the event it was started by, which for a tag push carries no
# input.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Cut a release from the default branch: patch, minor, major, or an exact version. Empty publishes the tag this runs from."
        required: false
        default: ""
      packages:
        description: "Recovery only. Crates to publish, space separated, in dependency order. Empty publishes the whole workspace."
        required: false
        default: ""

# Publishing cannot be undone, so one release runs at a time whatever the
# tag. Not `cancel-in-progress`: a run killed between two uploads is the one
# state this is here to avoid. `queue: max` because the default drops all but
# the newest waiting run, and a cut queues its own publish behind itself.
concurrency:
  group: release
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  # The same gate CI runs, from the same file, so the two cannot drift. A tag
  # is cut from a green `main`, so this is belt and braces: cheap next to a
  # publish that cannot be taken back.
  gate:
    uses: ./.github/workflows/ci.yaml

  # Its own job, with no `needs`, so a dispatch that cannot cut a release says
  # so in seconds rather than after the gate.
  cut_inputs:
    if: inputs.bump != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the dispatch can cut a release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PACKAGES: ${{ inputs.packages }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "branch" ] || [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "error: a release is cut from $DEFAULT_BRANCH, not from $GITHUB_REF_TYPE $GITHUB_REF_NAME." >&2
            exit 1
          fi
          if [ -n "$PACKAGES" ]; then
            echo "error: packages belongs to the publish half. Leave it empty to cut a release." >&2
            exit 1
          fi

  # Bump, commit, tag, push. The publish half then runs against that tag.
  cut:
    if: inputs.bump != ''
    needs: [gate, cut_inputs]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # The release commit and its tag.
      contents: write
      # Starting the publish run below.
      actions: write
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (2026-08-05)
        with:
          toolchain: stable

      - name: Install cargo-release
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-release

      # Last, and credentialed: this job pushes, so the write token has to
      # reach the git config, and everything that runs before it is a third
      # party.
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # `release.toml` decides what a release is, here as on a laptop: which
      # crates move, the tag's name, and that nothing is published from the
      # machine that cuts it.
      - name: Cut the release
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cargo release "$BUMP" --execute --no-confirm

      # A tag pushed with `github.token` does not fire the `push` trigger.
      # `workflow_dispatch` is exempt from that, so the publish half is
      # started by name.
      - name: Start the publish run on the new tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "qbrs") | .version')"
          gh workflow run release.yaml --ref "v$version"

  publish:
    if: inputs.bump == ''
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # crates.io Trusted Publishing: the OIDC claim is what authenticates,
      # so no crates.io token is stored anywhere. The action's post step
      # revokes the short-lived one it fetched.
      id-token: write
      # The GitHub release below.
      contents: write
    steps:
      # `cargo publish` runs this workspace's build scripts and proc macros.
      # Nothing here pushes, and the release below authenticates by `GH_TOKEN`,
      # so the job's write token has no reason to sit in the git config while
      # that code runs.
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (2026-08-05)
        with:
          toolchain: stable

      # The tag names the version; the manifest is what gets published. A
      # mistyped tag would otherwise publish something other than what it
      # says, and crates.io keeps whatever it is handed. The ref type is
      # checked too, since a branch can be named like a tag. This is what
      # holds a recovery run to the tag.
      - name: Check the ref is the version tag
        run: |
          tree="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "qbrs") | .version')"
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [ "v$tree" != "$GITHUB_REF_NAME" ]; then
            echo "error: $GITHUB_REF_TYPE $GITHUB_REF_NAME is not the tag v$tree." >&2
            echo "       Run this from the version tag." >&2
            exit 1
          fi

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # One command for all four: cargo orders them by dependency, waits on
      # the index between them, and verifies each against the siblings being
      # published beside it rather than against the last release.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          # Through the environment, not interpolated into the script: an
          # input that reaches a shell as text is a shell it can rewrite.
          PACKAGES: ${{ inputs.packages }}
        run: |
          # The input is a list of names, so it is split into words. Globbing
          # is off, so a name is never matched against a filename.
          set -f
          set -- $PACKAGES
          set +f
          if [ "$#" -gt 0 ]; then
            for package in "$@"; do
              cargo publish -p "$package" --locked
            done
          else
            cargo publish --workspace --locked
          fi

      # After the upload, so a release never points at a version crates.io
      # does not have. Tolerates the release already existing.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            || gh release view "$GITHUB_REF_NAME" >/dev/null
