name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Cut a release from the default branch: patch, minor, major, or an exact version. Empty publishes the tag this runs from."
        required: false
        default: ""
      packages:
        description: "Recovery only. Crates to publish, space separated, in dependency order. Empty publishes the whole workspace."
        required: false
        default: ""

# Not `cancel-in-progress`: a run killed between two uploads is the state this group
# exists to prevent. `queue: max` rather than the default, which keeps only the newest
# waiting run and so can drop the publish a cut queues behind itself.
concurrency:
  group: release
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  # Not dropped as redundant with `main`'s own CI: it is cheap next to a publish that
  # cannot be taken back.
  gate:
    uses: ./.github/workflows/ci.yaml

  # No `needs: gate`, so a dispatch that cannot do anything is refused in seconds
  # rather than after the gate.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check the ref and the inputs
        env:
          BUMP: ${{ inputs.bump }}
          PACKAGES: ${{ inputs.packages }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$BUMP" ]; then
            if [ "$GITHUB_REF_TYPE" != "tag" ]; then
              echo "error: publishing runs from a version tag, not from $GITHUB_REF_TYPE $GITHUB_REF_NAME." >&2
              exit 1
            fi
            exit 0
          fi
          if [ "$GITHUB_REF_TYPE" != "branch" ] || [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "error: a release is cut from $DEFAULT_BRANCH, not from $GITHUB_REF_TYPE $GITHUB_REF_NAME." >&2
            exit 1
          fi
          case "$BUMP" in
            patch | minor | major | [0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "error: bump is patch, minor, major, or an exact version, not '$BUMP'." >&2
              exit 1
              ;;
          esac
          if [ -n "$PACKAGES" ]; then
            echo "error: packages belongs to the publish half. Leave it empty to cut a release." >&2
            exit 1
          fi

  cut:
    if: inputs.bump != ''
    needs: [gate, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      # Not removable as unused: `gh workflow run` below needs it.
      actions: write
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-15)
        with:
          toolchain: stable

      # Built from source rather than through `taiki-e/install-action`, so the one job
      # holding a write token runs no third-party action. Pinned, since this tool decides
      # what a release is.
      - name: Install cargo-release
        run: cargo install cargo-release --locked --version 1.1.6

      # No `persist-credentials: false`, unlike every other checkout: this job pushes, so
      # the write token has to reach the git config. It comes after the installs so
      # nothing earlier is handed the token.
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # No flags beyond `--execute`: `release.toml` decides what a release is, the same
      # here as on a laptop.
      - name: Cut the release
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cargo release "$BUMP" --execute --no-confirm

      # Not left to the tag's `push` trigger, which a tag pushed with `github.token`
      # does not fire. `workflow_dispatch` is exempt, so the publish half is started by
      # name.
      - name: Start the publish run on the new tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "qbrs") | .version')"
          # Retried rather than run once: the API can still 404 on a tag pushed moments ago.
          for attempt in 1 2 3 4 5; do
            [ "$attempt" -eq 1 ] || sleep "$((attempt * 5))"
            gh workflow run release.yaml --ref "v$version" && exit 0
          done
          echo "error: could not start the publish run on v$version." >&2
          exit 1

  publish:
    if: inputs.bump == ''
    needs: [gate, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # OIDC through Trusted Publishing rather than a stored crates.io token, so no
      # credential outlives this job.
      id-token: write
      contents: write
    steps:
      # Not persisted: `cargo publish` runs this workspace's build scripts and proc macros,
      # nothing here pushes, and the release below authenticates by `GH_TOKEN`.
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-15)
        with:
          toolchain: stable

      # Not covered by `preflight`, which checks only that the ref is a tag: a mistyped
      # tag would publish the manifest's version under a name it does not carry, and
      # crates.io keeps whatever it is handed.
      - name: Check the tag names the version in the tree
        run: |
          tree="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "qbrs") | .version')"
          if [ "$GITHUB_REF_NAME" != "v$tree" ]; then
            echo "error: tag $GITHUB_REF_NAME does not name the workspace version v$tree." >&2
            exit 1
          fi

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # One `--workspace` command rather than a loop over the four: cargo then orders them
      # by dependency, waits on the index between them, and verifies each against the
      # siblings beside it rather than the last release.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          # Through the environment rather than interpolated into the script, which an
          # input reaching the shell as text could rewrite.
          PACKAGES: ${{ inputs.packages }}
        run: |
          # Unquoted on purpose, to split the list into words. Globbing is off so a name is
          # never matched against a filename.
          set -f
          set -- $PACKAGES
          set +f
          if [ "$#" -gt 0 ]; then
            for package in "$@"; do
              cargo publish -p "$package" --locked
            done
          else
            cargo publish --workspace --locked
          fi

      # Not before the upload, which could leave a release pointing at a version crates.io
      # does not have. The `||` tolerates a release that already exists.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            || gh release view "$GITHUB_REF_NAME" >/dev/null
