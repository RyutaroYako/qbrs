name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A superseded PR run should cancel — that's what this exists for. A push
  # to `main` never should: it's already merged, there's nothing to
  # supersede it with, and a run killed mid-build can still save a corrupt
  # cache (see the `save-if` note below). Grouping pushes by commit SHA
  # gives each one its own group, so there's nothing for `cancel-in-progress`
  # to act on even though the setting is harmless either way there.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    # No Postgres service: the real-DB tests start their own embedded
    # Postgres (see crates/qbrs-sqlx/tests/common/mod.rs).
    steps:
      # actions/* are maintained by GitHub itself, so we track the latest
      # release tag directly. Third-party actions below are pinned to a
      # full commit SHA instead, per the project's supply-chain policy.
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (2026-08-05)
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # PR runs only ever restore, never save: a PR run cancelled
          # mid-build (see `concurrency` above) can still reach this
          # action's post-job save step, saving a half-extracted `pglite-rs`
          # runtime under `~/.cargo/registry` as if it were complete. That
          # corrupt cache is keyed by Cargo.lock's hash, so it's shared
          # across every branch and poisons every PR's build until purged
          # by hand. `push` to `main` never gets cancelled, so it's the only
          # trusted source for a save.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets --locked

      - name: Test
        run: cargo test --workspace --locked --all-features
