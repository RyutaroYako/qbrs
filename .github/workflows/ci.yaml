name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Not copied into `release.yaml`: it calls this file, so a release passes the gate
  # every commit passes.
  workflow_call:

concurrency:
  # Not `cancel-in-progress: true` for a push to `main`: nothing supersedes it, and a run
  # killed mid-build can still save a corrupt cache. Grouping pushes by SHA keeps them
  # apart as well.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Not the default token permissions: `taiki-e/install-action` reaches `github.token`
# whether or not it is handed one, and nothing here writes to the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Not left to `.config/nextest.toml`, which bounds only tests: a hung build or doctest
    # otherwise runs to GitHub's six-hour limit.
    timeout-minutes: 30
    # No `services: postgres`: the real-DB tests start their own embedded Postgres.
    steps:
      # A release tag here, but a full commit SHA for a third-party action: the
      # supply-chain policy trusts GitHub's own `actions/*` releases and no one else's.
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-15)
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Not covered by the cargo cache below: it carries a `target/` that records the
      # absolute path into this directory, but not the directory itself.
      - name: Cache the pglite engine
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pglite-rs
          key: pglite-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: pglite-${{ runner.os }}-

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Not saved from a PR: no other branch can restore a PR's cache, and its saves count
          # against the repository's cache quota, evicting the `main` cache every PR restores.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # No `restore-keys`: a template from an older `pglite-rs` can be a PostgreSQL major
      # the new server refuses. Placed after the cargo cache so it saves before that
      # cache prunes `target/`.
      - name: Cache the embedded-Postgres template
        uses: actions/cache@v6.1.0
        with:
          path: target/tmp/pg-template
          key: pg-template-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      # Not left to cargo: with the engine gone, `pglite-rs` re-runs its build script and
      # panics, while `pglite-rs-sys`, which would download it, declares no file inputs
      # and stays fresh. Dropping both build directories forces the download.
      - name: Re-download the engine if the cargo cache outlived it
        run: |
          if ! ls ~/.cache/pglite-rs/*/*/pglite-runtime.tar >/dev/null 2>&1; then
            rm -rf target/*/build/pglite-rs-* target/*/build/pglite-rs-sys-*
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets --locked

      # nextest rather than `cargo test`, which runs one test binary at a time and so
      # starts each embedded Postgres in turn.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest

      - name: Test
        run: cargo nextest run --workspace --locked --all-features

      # Not a duplicate of the step above: nextest does not run doctests.
      - name: Doc tests
        run: cargo test --workspace --locked --all-features --doc

  # Not `--workspace`: the test crates need the pglite engine, and nothing ships them.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-15)
        with:
          toolchain: "1.94"

      - name: Check
        run: cargo check -p qbrs-core -p qbrs-macros -p qbrs -p qbrs-sqlx --all-features --locked
