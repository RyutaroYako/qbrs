[package]
name = "qbrs-examples"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
qbrs = { path = "../crates/qbrs", features = ["json"] }
qbrs-sqlx = { path = "../crates/qbrs-sqlx", features = ["json"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
embedded-pg = { path = "../tests/embedded-pg" }
serde_json = "1"
